name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O PROJETO
      # =========================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # =========================================================
      # 2. CONFIGURAR NODE.JS
      # =========================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. CONFIGURAR JAVA
      # =========================================================
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # =========================================================
      # 4. CRIAR PACKAGE.JSON
      # =========================================================
      - name: Criar package.json
        run: npm init -y


      # =========================================================
      # 5. INSTALAR TYPESCRIPT
      # =========================================================
      - name: Instalar TypeScript
        run: npm install --save-dev typescript


      # =========================================================
      # 6. INSTALAR CAPACITOR + COMPARTILHAMENTO
      # =========================================================
      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/filesystem


      # =========================================================
      # 7. PREPARAR A APLICAÇÃO WEB
      # =========================================================
      - name: Preparar aplicação web
        run: |
          rm -rf www
          mkdir -p www

          find . -mindepth 1 -maxdepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name ".git" \
            ! -name ".github" \
            -exec cp -r {} www/ \;


      # =========================================================
      # 8. CRIAR CONFIGURAÇÃO DO CAPACITOR
      # =========================================================
      - name: Criar configuração do Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'br.com.agroceres.binova',
            appName: 'Agroceres Binova',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF


      # =========================================================
      # 9. REMOVER ANDROID ANTERIOR
      # =========================================================
      - name: Remover Android anterior
        run: rm -rf android


      # =========================================================
      # 10. CRIAR PROJETO ANDROID
      # =========================================================
      - name: Criar projeto Android
        run: npx cap add android


      # =========================================================
      # 11. BLOQUEAR PRINT E GRAVAÇÃO DE TELA
      # =========================================================
      - name: Aplicar bloqueio de captura de tela
        shell: bash
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          echo "MainActivity encontrada em:"
          echo "$MAIN"

          PACKAGE=$(grep '^package ' "$MAIN" | sed 's/package //;s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: pacote Android não encontrado."
            exit 1
          fi

          echo "Pacote Android: $PACKAGE"

          cat > "$MAIN" <<EOF
          package $PACKAGE;

          import android.os.Bundle;
          import android.view.WindowManager;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          EOF

          echo ""
          echo "Bloqueio de captura aplicado com sucesso."

          grep -n "FLAG_SECURE" "$MAIN"


      # =========================================================
      # 12. COPIAR A APLICAÇÃO PARA O ANDROID
      # =========================================================
      - name: Copiar aplicação para Android
        run: npx cap sync android


      # =========================================================
      # 13. GERAR APK
      # =========================================================
      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      # =========================================================
      # 14. DISPONIBILIZAR APK
      # =========================================================
      - name: Disponibilizar APK
  uses: actions/upload-artifact@v4
  with:
    name: portfolio-agroceres-binova-apk-v2
    path: android/app/build/outputs/apk/debug/app-debug.apk
