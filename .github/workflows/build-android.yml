name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Criar package.json
        run: npm init -y

      - name: Instalar TypeScript
        run: npm install --save-dev typescript

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar aplicação web
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -d "img" ]; then
            cp -r img www/
          fi

          find . -maxdepth 1 -type f \
            \( -name "*.webp" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" \) \
            -exec cp {} www/ \;

      - name: Remover Android anterior
        run: rm -rf android

      - name: Criar projeto Android
        run: npx cap add android

      - name: Copiar aplicação para Android
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agroceres-binova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
