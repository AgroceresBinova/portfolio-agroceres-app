name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Criar package.json
        run: npm init -y

      - name: Instalar TypeScript
        run: npm install --save-dev typescript

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/filesystem

      - name: Preparar aplicação web
        run: |
          rm -rf www
          mkdir -p www

          find . -mindepth 1 -maxdepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name ".git" \
            ! -name ".github" \
            -exec cp -r {} www/ \;

      - name: Criar configuração do Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'br.com.agroceres.binova',
            appName: 'Agroceres Binova',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Remover Android anterior
        run: rm -rf android

      - name: Criar projeto Android
        run: npx cap add android

      - name: Aplicar bloqueio de captura de tela
        shell: bash
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN" | sed 's/package //;s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: pacote Android não encontrado."
            exit 1
          fi

          cat > "$MAIN" <<EOF
          package $PACKAGE;

          import android.os.Bundle;
          import android.view.WindowManager;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          EOF

          echo "Bloqueio de captura aplicado com sucesso."

      - name: Copiar aplicação para Android
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-agroceres-binova-apk-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
